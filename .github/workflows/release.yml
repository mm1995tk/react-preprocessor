name: Release

# Pushing a tag such as v0.1.0 runs the checks and then publishes to npm
on:
  push:
    tags: ["v*"]

# The default for every job. Only `publish` asks for more
permissions:
  contents: read

jobs:
  # Installs dependencies and runs their code, so it must not be able to publish
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Check that the tag matches the version in package.json
        run: |
          version=$(nix develop -c node -p "require('./packages/react-preprocessor/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in package.json" >&2
            exit 1
          fi
      - run: nix develop -c pnpm install --frozen-lockfile
      - run: nix develop -c pnpm check
      - name: Build and check the package
        working-directory: packages/react-preprocessor
        # publint and attw are devDependencies, so pnpm-lock.yaml pins them and everything they depend on
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          nix develop -c pnpm pack --pack-destination "$RUNNER_TEMP/package"
          nix develop -c pnpm exec publint "$RUNNER_TEMP"/package/react-preprocessor-*.tgz
          nix develop -c pnpm exec attw --profile esm-only "$RUNNER_TEMP"/package/react-preprocessor-*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/react-preprocessor-*.tgz
          if-no-files-found: error
          retention-days: 1

  # Publishes the tarball that `check` built. No dependency is installed and no script of the package runs here
  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed for npm Trusted Publishing (OIDC). No token is kept in secrets
      id-token: write
    steps:
      # The checkout is only for the flake that provides npm
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Publish to npm
        # The npm CLI (11.5.1 or later) handles the OIDC authentication. The tarball that was checked is the one published
        run: nix develop -c npm publish "$RUNNER_TEMP"/package/react-preprocessor-*.tgz --access public --ignore-scripts
